{% extends "layout.html" %}

{% block title %}{{data.title}}{% endblock %}

{% block body %}
    <h1>{{data.message}}</h1>

    <fieldset class="grupo-formulario">
        <legend>Parametros</legend>

        <div class="campo">
            <label>Letra inicial:</label>
            <input type="text" id="txtLetraInicial" name="txtLetraInicial">
        </div>
        <div class="campo">
            <label>Palabra clave:</label>
            <input type="text" id="txtPalabraClave" name="txtPalabraClave">
        </div>
        <div class="campo-opcion">
            <input type="checkbox" id="chkInverso" name="chkInverso">
            <label>Abecedario inverso:</label>            
        </div>
        <div class="campo-opcion">
            <input type="checkbox" id="chkAlfanumerico" name="chkAlfanumerico">
            <label>Alfanumerico:</label>
        </div>
        <div class="grupo-radio">
            <span>Tipo de abecedario</span>

            <label><input type="radio" id="rdAbecedario26" name="rdAbecedario" checked>26 letras:</label>
            <label><input type="radio" id="rdAbecedario27" name="rdAbecedario">27 letras:</label>
        </div>
        <br>        
        <button onclick="generar()">Generar Abecedario</button>
    </fieldset>

    <p id="resultado"></p> 

    <div class="contenedor-tabla">
        <table id="tablaAbecedario" style="display: none;">
            <thead>
                <tr>
                    <th id="tituloAbecedario"></th>
                </tr>
            </thead>
            <tbody>
                <tr id="filaAbecedario">
                </tr>
            </tbody>
        </table>
    </div>

    <div id="divVariables" style="display: none;">
        <fieldset class="grupo-formulario">
            <div class="campo">
                <input type="text" id="txtCifrado" style="width: 100%; max-width: 600px;">        
            </div>
            <div class="grupo-radio">
                <span>Tipo de cifrado</span>

                <label><input type="radio" id="rdTrasposicion" name="rdCifrado" checked>Trasposicion</label>
                <label><input type="radio" id="rdTrama" name="rdCifrado">Trama</label>
                <label><input type="radio" id="rdClaveNumerica" name="rdCifrado">Clave Numerica</label>
            </div>
            <br>
            <button onclick="generarCifrado()">Generar Cifrado</button>
        </fieldset>
    </div>

    <div class="contenedor-tabla">
        <table id="tablaGenerada" style="display: none;">
            <thead>
                <tr>
                    <th id="tituloTablaGenerada"></th>
                </tr>
            </thead>
            <tbody>
                <tr id="filaTablaGenerada"></tr>
            </tbody>
        </table>
    </div>

    <div>
        <table id="tablaClaveNumericaExplicativa" style="display: none;">
            <thead>
                
            </thead>
            <tbody>
                
            </tbody>
        </table>
    </div>

    <div id="divEncriptar" style="display: none;">
        <fieldset class="grupo-formulario">
            <div class="campo">
                <input type="text" id="txtFrase" style="width: 100%; max-width: 600px;">
            </div>
            <button onclick="generarEncriptacion()">Encriptar</button>
        </fieldset>
    </div>

{% endblock %}

{% block scripts %}
    <script>
        function generarEncriptacion(){
            alert('XD')
        }
    </script>    
{% endblock %}
