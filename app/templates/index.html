{% extends "layout.html" %}

{% block title %}{{data.title}}{% endblock %}

{% block body %}
    <h1>{{data.message}}</h1>

    <fieldset class="grupo-cifrado">
        
        <div>
            <label>26 letras:</label>
            <input type="radio" id="rdAbecedario26" name="rdAbecedario" checked>
            <label>27 letras:</label>
            <input type="radio" id="rdAbecedario27" name="rdAbecedario">
            <br><br>
            <label>Inverso:</label>
            <input type="checkbox" id="chkInverso" name="chkInverso">
            <label>Alfanumerico:</label>
            <input type="checkbox" id="chkAlfanumerico" name="chkAlfanumerico">
            <br><br>
            <label>Iniciar desde:</label>
            <input type="text" id="txtLetraInicial" name="txtLetraInicial">
            <label>Palabra clave:</label>
            <input type="text" id="txtPalabraClave" name="txtPalabraClave">
            <br><br>
            <button onclick="generar()">Generar Abecedario</button>
        </div>
    </fieldset>
    
    <p id="resultado"></p>

    <div>
        <table>
            <thead>
                <tr>
                    <th colspan="{{ data.abecedarioBase|length }}">ABECEDARIO ORIGINAL</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    {% for letra in data.abecedarioBase %}                
                        <td>{{ letra }}</td>
                    {% endfor %}
                </tr>
            </tbody>
        </table>
    </div>

    <div>
        <table id="tablaGenerada" style="display: none;">
            <thead>
                <tr>
                    <th id="tituloTabla"></th>
                </tr>
            </thead>
            <tbody>
                <tr id="filaAbecedario">
                </tr>
            </tbody>
        </table>
    </div>

    <div id="divVariables" style="display: none;">
        <input type="text" id="txtTrasposicion" name="txtTrasposicion">
        <button onclick="generarTrasposicion()">Trasposicion</button>
        <input type="text" id="txtTrama" name="txtTrama">
        <button onclick="generarTrama()">Trama</button>
        <input type="text" id="txtClaveNumerica" name="txtClaveNumerica">
        <button onclick="generarClaveNumerica()">Clave Numerica</button>
    </div>

    <div>
        <table id="tablaTrasposicion" style="display: none;">
            <thead>
                <tr>
                    <th id="tituloTablaTrasposicion"></th>
                </tr>
            </thead>
            <tbody>
                <tr id="filaTablaTrasposicion"></tr>
            </tbody>
        </table>
    </div>

    <div>
        <table id="tablaTrama" style="display: none;">
            <thead>
                <tr>
                    <th id="tituloTablaTrama"></th>
                </tr>
            </thead>
            <tbody>
                <tr id="filaTablaTrama"></tr>
            </tbody>
        </table>
    </div>

    <div>
        <table id="tablaClaveNumericaExplicativa" style="display: none;">
            <thead>
                
            </thead>
            <tbody>
                
            </tbody>
        </table>
        <table id="tablaClaveNumerica" style="display: none;">
            <thead>
                <tr>
                    <th id="tituloTablaClaveNumerica"></th>
                </tr>
            </thead>
            <tbody>
                <tr id="filaTablaClaveNumerica"></tr>
            </tbody>
        </table>
    </div>

{% endblock %}

{% block scripts %}
    <script>
        let abecedarioBase;

        /* =========================================================
            FUNCIONES GENERALES
        ========================================================= */

        function mostrarError(mensaje, error) {
            console.error("Error:", error);
            document.getElementById("resultado").innerText = mensaje;
        }

        function mostrarMensajeSinResultado(idTitulo, mensaje) {
            document.getElementById(idTitulo).innerText = mensaje;
        }

        function agregarCeldas(fila, datos) {
            for (const dato of datos) {
                const celda = fila.insertCell();
                celda.innerText = dato;
            }
        }

        function renderizarTabla(idFila, idTitulo, titulo, datos) {

            const fila = document.getElementById(idFila);
            const tituloTabla = document.getElementById(idTitulo);

            fila.innerHTML = "";
            tituloTabla.colSpan = datos.length;
            tituloTabla.innerText = titulo;

            for (const dato of datos) {
                const celda = document.createElement("td");
                celda.innerText = dato;
                fila.appendChild(celda);
            }
        }

        /* =========================================================
            GENERAR ABECEDARIO
        ========================================================= */

        function generar(){
            const datos = obtenerDatosFormulario();

            enviarGeneracion(datos)
                .then(data => {
                    procesarResultado(data);
                })
                .catch(error => {
                    mostrarError("Error al generar el abecedario.", error);
                });
        }

        function obtenerDatosFormulario(){
            return {
                letraInicial: document.getElementById("txtLetraInicial").value,
                palabraClave: document.getElementById("txtPalabraClave").value,
                inverso: document.getElementById("chkInverso").checked,
                alfanumerico: document.getElementById("chkAlfanumerico").checked,
                cantidad_letras: document.getElementById("rdAbecedario27").checked
                    ? 27
                    : 26
            }
        }

        function enviarGeneracion(datos){

            return fetch("/generar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(datos)
            })
            .then(response => {
                if(!response.ok){
                    throw new Error("Error en la respuesta del servidor");
                }

                return response.json();
            });
        }

        function procesarResultado(data){
            abecedarioBase = data.abecedario_generado;

            if (abecedarioBase.length === 0) {
                mostrarMensajeSinResultado("tituloTabla", "No se generó ningún abecedario");
                return;
            }

            renderizarTabla("filaAbecedario", "tituloTabla", "ABECEDARIO GENERADO", abecedarioBase);
            
            document.getElementById("tablaGenerada").style.display = "table";
            document.getElementById("divVariables").style.display = "inline";
        }

        /* =========================================================
            GENERAR TRASPOSICION
        ========================================================= */

        function generarTrasposicion(){
            const datos = obtenerDatosTrasposicion();

            enviarTrasposicion(datos)
                .then(data => {
                    procesarTrasposicion(data);
                })
                .catch(error => {
                    mostrarError("Error al generar la trasposición.", error);
                });
        }

        function obtenerDatosTrasposicion(){
            return {
                trasposicion: document.getElementById("txtTrasposicion").value,
                abecedario: abecedarioBase
            };        
        }

        function enviarTrasposicion(datos) {

            return fetch("/generarTrasposicion", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(datos)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Error en la respuesta del servidor");
                }

                return response.json();
            });
        }

        function procesarTrasposicion(data) {

            if (data.abecedario_generado.length === 0) {
                mostrarMensajeSinResultado("tituloTablaTrasposicion", "No se generó ningún abecedario");
                return;
            }

            renderizarTabla("filaTablaTrasposicion", "tituloTablaTrasposicion", "ABECEDARIO TRASPOSICION GENERADO", data.abecedario_generado);
            actualizarTablaExplicativa(data.abecedario_explicativo);

            document.getElementById("tablaTrasposicion").style.display = "table";
        }

        function actualizarTablaExplicativa(datos) {

            const tabla = document.getElementById("tablaGenerada");
            let fila = document.getElementById("filaTrasposicion");

            // Crear la fila solamente si todavía no existe
            if (!fila) {
                fila = tabla.insertRow();
                fila.id = "filaTrasposicion";
            }
            else {
                fila.innerHTML = "";
            }

            agregarCeldas(fila, datos.map(elemento => elemento.id));
        }

        /* =========================================================
            GENERAR TRAMA
        ========================================================= */

        function generarTrama(){
            const datos = obtenerDatosTrama();

            enviarTrama(datos)
                .then(data => {
                    procesarTrama(data);
                })
                .catch(error => {
                    mostrarError("Error al generar la trama.", error);
                });
        }

        function obtenerDatosTrama(){
            return {
                trama: document.getElementById("txtTrama").value,
                abecedario: abecedarioBase
            };        
        }

        function enviarTrama(datos) {

            return fetch("/generarTrama", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(datos)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Error en la respuesta del servidor");
                }

                return response.json();
            });
        }

        function procesarTrama(data) {

            if (data.abecedario_generado.length === 0) {
                mostrarMensajeSinResultado("tituloTablaTrama", "No se generó ningún abecedario");
                return;
            }

            renderizarTabla("filaTablaTrama", "tituloTablaTrama", "ABECEDARIO TRAMA GENERADO", data.abecedario_generado);
            actualizarTablaExplicativa(data.abecedario_explicativo);

            document.getElementById("tablaTrama").style.display = "table";
        }

        /* =========================================================
            GENERAR CLAVE NUMERICA
        ========================================================= */

        function generarClaveNumerica(){
            const datos = obtenerDatosClaveNumerica();

            enviarClaveNumerica(datos)
                .then(data => {
                    procesarClaveNumerica(data);
                })
                .catch(error => {
                    mostrarError("Error al generar la trama.", error);
                });
        }

        function obtenerDatosClaveNumerica(){
            return {
                claveNumerica: document.getElementById("txtClaveNumerica").value,
                abecedario: abecedarioBase
            };        
        }

        function enviarClaveNumerica(datos) {

            return fetch("/generarClaveNumerica", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(datos)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Error en la respuesta del servidor");
                }

                return response.json();
            });
        }

        function procesarClaveNumerica(data) {

            if (data.abecedario_generado.length === 0) {
                mostrarMensajeSinResultado("tituloTablaClaveNumerica", "No se generó ningún abecedario");
                return;
            }

            renderizarTabla("filaTablaClaveNumerica", "tituloTablaClaveNumerica", "ABECEDARIO CLAVE NUMERICA GENERADO", data.abecedario_generado);
            mostrarTabla(data.columnas, data.abecedario_explicativo);

            document.getElementById("tablaClaveNumerica").style.display = "table";
            document.getElementById("tablaClaveNumericaExplicativa").style.display = "table";
        }

        function mostrarTabla(columnas, tabla){
            const tablaHTML = document.getElementById("tablaClaveNumericaExplicativa");
            const thead = tablaHTML.querySelector("thead");
            const tbody = tablaHTML.querySelector("tbody");

            thead.innerHTML = "";
            tbody.innerHTML = "";

            const filaEncabezado = document.createElement("tr");

            columnas.forEach(numero => {
                const th = document.createElement("th");

                th.textContent = numero;

                filaEncabezado.appendChild(th);
            });

            thead.appendChild(filaEncabezado);

            tabla.forEach(fila => {
                const tr = document.createElement("tr");

                fila.forEach(letra => {
                    const td = document.createElement("td");

                    td.textContent = letra;

                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });

        }

    </script>    
{% endblock %}
