<!DOCTYPE html>
<html lang='en'>

    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>{% block title %}{% endblock %}</title>
    <link rel='stylesheet' href='{{ url_for('static', filename='css/layout.css') }}'>
</head>
<body>
    {% block body %}{% endblock %}
    <script src='{{ url_for('static', filename='js/layout.js') }}'></script>
    <script src='{{ url_for('static', filename='js/trasposicion.js') }}'></script>
    <script src='{{ url_for('static', filename='js/trama.js') }}'></script>
    <script src='{{ url_for('static', filename='js/claveNumerica.js') }}'></script>
    <script src='{{ url_for('static', filename='js/abecedario.js') }}'></script>
    {% block scripts %}{% endblock %}
</body>
</html>
